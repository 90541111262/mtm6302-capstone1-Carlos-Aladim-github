<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASA - Contact</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <img src="images/Nasa_Logo.png" alt="NASA Logo" class="logo">
        <nav>
            <ul>
                <li><a href="index.html">HOME</a></li>
                <li><a href="about.html">ABOUT</a></li>
                <li><a href="contact.html" class="active">CONTACT</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="content">
            <h1 class="title">CONTACT US</h1>
            <div class="mb-3">
                <label for="exampleFormControlInput1" class="form-label">Name</label>
                <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="type your name here">
              </div>
              <div class="mb-3">
                <label for="exampleFormControlInput1" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="name@example.com">
              </div>
              <div class="mb-3">
                <label for="exampleFormControlTextarea1" class="form-label">Message</label>
                <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
              </div>
              <button type="button" class="btn btn-secondary">Send</button>
            </section>
    </main>
    <footer>
        <div class="footer-column">
            <img src="images/Nasa_Logo.png" alt="NASA Logo" class="logo-footer">
            <p>780-504-7832<br>admin@nasa.com<br>Welcome to NASA Headquarters, <br>
                located at 300 Hidden Figures Way SW, Washington, D.C.</p>
        </div>
        <div class="footer-column">
            <ul>
                <li><a href="index.html">HOME</a></li>
                <li><a href="about.html">ABOUT</a></li>
                <li><a href="contact.html">CONTACT</a></li>
            </ul>
        </div>
        <div class="footer-column">
            <div class="social-icons">
                <a href="https://www.instagram.com/nasa/"><img src="images/Instagram.png" alt="Instagram"></a>
                <a href="https://www.linkedin.com/company/nasa/"><img src="images/Linkedin.png" alt="LinkedIn"></a>
                <a href="https://www.facebook.com/NASA"><img src="images/Facebook.png" alt="Facebook"></a>
            </div>
            <h4 class="newsletter-title">NEWSLETTER</h4>
            <input type="email" placeholder="e-mail" class="newsletter-input">
            <p class="footer-text">ASBB . © . 2024</p>
        </div>
    
    </footer>
    <script src="js/script.js"></script>
</body>
</html>
